name: CodeQL + Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  docker:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t go-web-server .

      - name: Run container
        run: docker run -d -p 8080:8080 --name go-web-server go-web-server

      - name: Test endpoint
        run: |
          for i in $(seq 1 10); do
            if curl --fail "http://localhost:8080/readfile?file=safe-files/hello.txt"; then
              echo "Success"
              exit 0
            fi
            echo "Waiting for server..."
            sleep 3
          done
          echo "Server did not respond"
          exit 1